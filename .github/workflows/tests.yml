name: Tests

# Runs the test suite that doesn't require an LLM API key. Tests that call a
# real LLM (llm_client, pipeline end-to-end, prompt-injection checks) are
# gated behind LLM_API_KEY with pytest.mark.skipif and self-skip here, since
# no such secret is configured for this workflow — see CONTRIBUTING.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: this workflow only reads the repo and runs tests,
# it never needs to write anything.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
